<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"></head><body><title>PixelMart Sprint Playbook</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:ital,wght@0,400;0,500;0,600;0,700;0,800;1,400&family=JetBrains+Mono:wght@400;500;600&display=swap">
<style>
/* Layout: sổ tay kỹ thuật hai cột — rail điều hướng sprint bên trái, trang làm việc bên phải; ticket là "thẻ việc" mở ra thành bảng tab. */
:root{
  --bg:#f5f6f3;            /* giấy kẻ ô, hơi ngả xanh rêu */
  --surface:#ffffff;
  --surface-2:#eef0eb;
  --ink:#1b211d;
  --ink-2:#4a544d;
  --ink-3:#7a857d;
  --line:#dde1d9;
  --accent:#1f6f54;        /* xanh "pixel" — dùng tiết chế */
  --accent-ink:#ffffff;
  --accent-soft:#dcefe6;
  --mark:#f3d36b;          /* highlight tìm kiếm */
  --ok:#2c7a3f; --warn:#a8641a; --bad:#b3372f;
  --ok-soft:#e1f1e4; --warn-soft:#f7ead8; --bad-soft:#f6e0dd;
  --a-api:#5b3fb6; --a-web:#0f7a8a; --a-admin:#a0621a; --a-devops:#4c5866; --a-db:#2f7d3a; --a-security:#b3372f; --a-contracts:#3446a8; --a-docs:#6b6b6b;
  --code-bg:#1d2420; --code-ink:#e3eadf; --code-dim:#93a39a;
  --f-display:"Be Vietnam Pro",system-ui,"Segoe UI",sans-serif;
  --f-body:"Be Vietnam Pro",system-ui,"Segoe UI",sans-serif;
  --f-mono:"JetBrains Mono",ui-monospace,"Cascadia Code",Consolas,monospace;
  --r:8px;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#121614; --surface:#1a1f1c; --surface-2:#222924; --ink:#e6ebe5; --ink-2:#b2bdb4; --ink-3:#7f8b82; --line:#2e3631;
  --accent:#5cc39a; --accent-ink:#0d1a14; --accent-soft:#1e3b30; --mark:#6b5a17;
  --ok:#6cc183; --warn:#e0a35a; --bad:#ec7f74; --ok-soft:#1d3324; --warn-soft:#3a2c19; --bad-soft:#3d2220;
  --a-api:#a993f0; --a-web:#4fc3d3; --a-admin:#e0a35a; --a-devops:#a4b0bd; --a-db:#74c47f; --a-security:#ec7f74; --a-contracts:#8fa0f0; --a-docs:#b0b0b0;
  --code-bg:#0c0f0d; --code-ink:#dfe8dc; --code-dim:#7f8f86; color-scheme:dark;
}}
:root[data-theme="dark"]{
  --bg:#121614; --surface:#1a1f1c; --surface-2:#222924; --ink:#e6ebe5; --ink-2:#b2bdb4; --ink-3:#7f8b82; --line:#2e3631;
  --accent:#5cc39a; --accent-ink:#0d1a14; --accent-soft:#1e3b30; --mark:#6b5a17;
  --ok:#6cc183; --warn:#e0a35a; --bad:#ec7f74; --ok-soft:#1d3324; --warn-soft:#3a2c19; --bad-soft:#3d2220;
  --a-api:#a993f0; --a-web:#4fc3d3; --a-admin:#e0a35a; --a-devops:#a4b0bd; --a-db:#74c47f; --a-security:#ec7f74; --a-contracts:#8fa0f0; --a-docs:#b0b0b0;
  --code-bg:#0c0f0d; --code-ink:#dfe8dc; --code-dim:#7f8f86; color-scheme:dark;
}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:15px;line-height:1.6;-webkit-font-smoothing:antialiased}
a{color:var(--accent)}
code{font-family:var(--f-mono);font-size:.86em;background:var(--surface-2);border:1px solid var(--line);padding:.05em .35em;border-radius:4px;overflow-wrap:anywhere}
pre{font-family:var(--f-mono);font-size:12.5px;line-height:1.55;background:var(--code-bg);color:var(--code-ink);padding:14px 16px;border-radius:var(--r);overflow-x:auto;margin:10px 0;max-width:100%}
pre code{background:none;border:0;padding:0;font-size:inherit;color:inherit}
h1,h2,h3,h4{font-family:var(--f-display);text-wrap:balance;line-height:1.25;margin:0}
button{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}

.app{display:grid;grid-template-columns:268px minmax(0,1fr);min-height:100vh}
/* ---------- rail ---------- */
.rail{position:sticky;top:env(safe-area-inset-top,0px);height:100vh;overflow-y:auto;border-right:1px solid var(--line);background:var(--surface);padding:20px 14px 28px;display:flex;flex-direction:column;gap:18px}
.brand{display:flex;align-items:center;gap:10px;padding:0 6px}
.brand-mark{width:28px;height:28px;display:grid;grid-template-columns:repeat(3,1fr);gap:2px}
.brand-mark i{background:var(--accent);border-radius:1px}
.brand-mark i:nth-child(2),.brand-mark i:nth-child(4),.brand-mark i:nth-child(9){opacity:.35}
.brand b{font-family:var(--f-display);font-weight:800;font-size:16px;letter-spacing:-.01em;display:block;line-height:1.1}
.brand small{color:var(--ink-3);font-size:11.5px}
.nav-group{display:flex;flex-direction:column;gap:2px}
.nav-label{font-size:10.5px;text-transform:uppercase;letter-spacing:.09em;color:var(--ink-3);font-weight:600;padding:0 8px 6px}
.nav-btn{display:grid;grid-template-columns:auto minmax(0,1fr) auto;align-items:center;gap:10px;width:100%;text-align:left;background:none;border:0;border-radius:6px;padding:7px 8px;cursor:pointer;color:var(--ink-2);font-size:13.5px}
.nav-btn:hover{background:var(--surface-2);color:var(--ink)}
.nav-btn[aria-current="true"]{background:var(--accent-soft);color:var(--ink);font-weight:600}
.nav-num{font-family:var(--f-mono);font-size:11px;width:22px;height:22px;display:grid;place-items:center;border-radius:5px;background:var(--surface-2);color:var(--ink-2);border:1px solid var(--line)}
.nav-btn[aria-current="true"] .nav-num{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.nav-meta{font-size:11px;color:var(--ink-3);font-variant-numeric:tabular-nums}
.nav-sub{display:block;font-size:11px;color:var(--ink-3);font-weight:400;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.mini-bar{height:3px;background:var(--line);border-radius:2px;margin-top:4px;overflow:hidden}
.mini-bar span{display:block;height:100%;background:var(--accent)}
.rail-foot{margin-top:auto;display:flex;flex-direction:column;gap:8px;padding:0 6px;font-size:12px;color:var(--ink-3)}
.theme-row{display:flex;gap:4px}
.theme-row button{flex:1;border:1px solid var(--line);background:var(--surface);border-radius:6px;padding:4px 0;font-size:11.5px;cursor:pointer;color:var(--ink-2)}
.theme-row button[aria-pressed="true"]{background:var(--ink);color:var(--bg);border-color:var(--ink)}

/* ---------- main ---------- */
.main{min-width:0;padding-inline:clamp(16px,4vw,48px);padding-block:22px 80px}
.topbar{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:color-mix(in srgb,var(--bg) 92%,transparent);backdrop-filter:blur(6px);margin-inline:calc(-1*clamp(16px,4vw,48px));padding:10px clamp(16px,4vw,48px);border-bottom:1px solid var(--line);display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.search{flex:1 1 260px;display:flex;align-items:center;gap:8px;background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:0 10px;min-width:0}
.search svg{flex:none;color:var(--ink-3)}
.search input{flex:1;border:0;background:none;padding:9px 0;font:inherit;font-size:14px;color:var(--ink);outline:none;min-width:0}
.search kbd{font-family:var(--f-mono);font-size:10.5px;border:1px solid var(--line);border-radius:4px;padding:1px 5px;color:var(--ink-3)}
.menu-btn{display:none;border:1px solid var(--line);background:var(--surface);border-radius:8px;padding:8px 10px;cursor:pointer}
.content{max-width:1040px;margin:0 auto;padding-top:26px;display:flex;flex-direction:column;gap:30px}
.eyebrow{font-size:11.5px;text-transform:uppercase;letter-spacing:.1em;font-weight:600;color:var(--accent)}
.lead{color:var(--ink-2);max-width:68ch;margin:0}
.section{display:flex;flex-direction:column;gap:14px}
.section > h2{font-size:20px;font-weight:700;letter-spacing:-.01em}
.section > h2 small{font-size:13px;font-weight:500;color:var(--ink-3);margin-left:8px}
.prose{max-width:76ch}
.prose p{margin:0 0 10px}
.prose ul,.prose ol{margin:0 0 10px;padding-left:20px}
.prose li{margin:3px 0}
.prose h4{font-size:14.5px;margin:16px 0 6px}
.note,.warn,.tip{border-radius:6px;padding:10px 14px;margin:10px 0;font-size:14px;border:1px solid}
.note{background:var(--surface-2);border-color:var(--line)}
.warn{background:var(--warn-soft);border-color:color-mix(in srgb,var(--warn) 35%,transparent)}
.tip{background:var(--ok-soft);border-color:color-mix(in srgb,var(--ok) 35%,transparent)}
.tbl-wrap{overflow-x:auto;max-width:100%;border:1px solid var(--line);border-radius:var(--r);background:var(--surface)}
table.t{border-collapse:collapse;width:100%;font-size:13.5px}
table.t th,table.t td{text-align:left;padding:8px 12px;border-bottom:1px solid var(--line);vertical-align:top}
table.t th{font-size:11.5px;text-transform:uppercase;letter-spacing:.06em;color:var(--ink-3);font-weight:600;background:var(--surface-2)}
table.t tr:last-child td{border-bottom:0}
.prose table.t{margin:10px 0;display:block;overflow-x:auto}

/* sprint header */
.sp-head{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:18px 28px;align-items:end;padding-bottom:18px;border-bottom:1px solid var(--line)}
.sp-title{font-size:clamp(26px,3.4vw,36px);font-weight:800;letter-spacing:-.02em}
.sp-title span{color:var(--ink-3);font-weight:600}
.sp-goal{margin-top:10px;font-size:16px;color:var(--ink-2);max-width:70ch}
.sp-stats{display:flex;gap:22px;flex-wrap:wrap}
.stat b{display:block;font-family:var(--f-display);font-size:22px;font-weight:700;font-variant-numeric:tabular-nums;line-height:1.1}
.stat span{font-size:11.5px;text-transform:uppercase;letter-spacing:.08em;color:var(--ink-3)}
.progress{grid-column:1/-1;display:flex;align-items:center;gap:12px;font-size:12.5px;color:var(--ink-3);font-variant-numeric:tabular-nums}
.progress .bar{flex:1;height:6px;background:var(--line);border-radius:4px;overflow:hidden}
.progress .bar span{display:block;height:100%;background:var(--accent);transition:width .3s}
.tags{display:flex;flex-wrap:wrap;gap:6px}
.tag{font-size:12.5px;padding:3px 10px;border-radius:999px;background:var(--surface);border:1px solid var(--line);color:var(--ink-2)}
.grid2{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:16px}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:16px 18px;min-width:0}
.panel h3{font-size:13px;text-transform:uppercase;letter-spacing:.08em;color:var(--ink-3);font-weight:600;margin-bottom:10px}
.order-list{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:8px;counter-reset:o}
.order-list li{display:grid;grid-template-columns:24px minmax(0,1fr);gap:10px;font-size:13.5px;counter-increment:o}
.order-list li::before{content:counter(o);font-family:var(--f-mono);font-size:11px;width:22px;height:22px;border-radius:50%;display:grid;place-items:center;background:var(--surface-2);border:1px solid var(--line);color:var(--ink-2)}
.order-list a{font-family:var(--f-mono);font-size:12.5px;font-weight:600;text-decoration:none;cursor:pointer}
.risk{display:grid;grid-template-columns:auto minmax(0,1fr);gap:10px;font-size:13.5px;padding:6px 0;border-bottom:1px dashed var(--line)}
.risk:last-child{border-bottom:0}
.lvl{font-size:10.5px;font-weight:700;text-transform:uppercase;letter-spacing:.06em;padding:2px 7px;border-radius:4px;height:fit-content;margin-top:2px}
.lvl.high{background:var(--bad-soft);color:var(--bad)} .lvl.med{background:var(--warn-soft);color:var(--warn)} .lvl.low{background:var(--ok-soft);color:var(--ok)}
.timeline{display:flex;flex-direction:column}
.tl-row{display:grid;grid-template-columns:150px minmax(0,1fr);gap:14px;padding:8px 0;border-bottom:1px solid var(--line);font-size:13.5px}
.tl-row:last-child{border-bottom:0}
.tl-row b{font-size:12px;color:var(--ink-2);font-weight:600}

/* tabs */
.tabs{display:flex;gap:2px;border-bottom:1px solid var(--line);overflow-x:auto;scrollbar-width:thin}
.tab{border:0;background:none;padding:9px 12px;font-size:13px;font-weight:500;color:var(--ink-3);cursor:pointer;border-bottom:2px solid transparent;white-space:nowrap;margin-bottom:-1px}
.tab:hover{color:var(--ink)}
.tab[aria-selected="true"]{color:var(--ink);border-bottom-color:var(--accent);font-weight:600}
.tab .cnt{font-family:var(--f-mono);font-size:10.5px;color:var(--ink-3);margin-left:4px}
.tabpanel{padding-top:14px;min-width:0}

/* filters */
.filters{display:flex;flex-wrap:wrap;gap:6px;align-items:center}
.chip{display:inline-flex;align-items:center;gap:6px;border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:4px 11px;font-size:12.5px;cursor:pointer;color:var(--ink-2)}
.chip i{width:8px;height:8px;border-radius:50%;background:var(--c,var(--ink-3))}
.chip[aria-pressed="true"]{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.tool-btn{border:1px solid var(--line);background:var(--surface);border-radius:6px;padding:5px 11px;font-size:12.5px;cursor:pointer;color:var(--ink-2)}
.tool-btn:hover{color:var(--ink);border-color:var(--ink-3)}
.spacer{flex:1}

/* tickets */
.tickets{display:flex;flex-direction:column;gap:10px}
.ticket{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);min-width:0}
.ticket[open]{border-color:color-mix(in srgb,var(--accent) 45%,var(--line));box-shadow:0 1px 0 var(--line),0 8px 24px -16px rgba(0,0,0,.25)}
.ticket > summary{list-style:none;cursor:pointer;padding:14px 16px;display:grid;grid-template-columns:auto minmax(0,1fr) auto;gap:6px 14px;align-items:center}
.ticket > summary::-webkit-details-marker{display:none}
.t-key{font-family:var(--f-mono);font-weight:600;font-size:12.5px;color:var(--accent);white-space:nowrap}
.t-title{font-weight:600;font-size:15px;min-width:0}
.t-meta{display:flex;gap:6px;align-items:center;flex-wrap:wrap;justify-content:flex-end}
.t-sub{grid-column:2/-1;display:flex;flex-wrap:wrap;gap:6px;align-items:center;font-size:12px;color:var(--ink-3)}
.pts{font-family:var(--f-mono);font-size:11.5px;font-weight:600;border:1px solid var(--line);border-radius:4px;padding:1px 6px;color:var(--ink-2);white-space:nowrap}
.type{font-size:11px;font-weight:600;padding:1px 7px;border-radius:4px;background:var(--surface-2);color:var(--ink-2)}
.type.story{background:var(--ok-soft);color:var(--ok)}
.area{font-size:11px;font-weight:600;padding:1px 7px;border-radius:4px;color:var(--c);background:color-mix(in srgb,var(--c) 12%,transparent)}
.owner{font-size:11px;font-weight:600;padding:1px 7px;border-radius:4px;border:1px dashed currentColor}
.owner.self{color:var(--warn)} .owner.ai{color:var(--ink-3)}
.t-prog{font-size:11.5px;color:var(--ink-3);font-variant-numeric:tabular-nums;white-space:nowrap}
.t-prog.done{color:var(--ok);font-weight:600}
.caret{transition:transform .2s;color:var(--ink-3)}
.ticket[open] .caret{transform:rotate(90deg)}
.t-body{padding:0 16px 18px;border-top:1px solid var(--line)}
.t-why{margin:14px 0 4px;color:var(--ink-2);font-size:14.5px;max-width:76ch}
.kv{display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));gap:8px 18px;margin:12px 0 4px;font-size:12.5px}
.kv div{min-width:0}
.kv span{display:block;font-size:10.5px;text-transform:uppercase;letter-spacing:.08em;color:var(--ink-3);font-weight:600}
.kv code{font-size:12px}
.copy{border:0;background:none;color:var(--ink-3);cursor:pointer;font-size:11px;padding:0 4px}
.copy:hover{color:var(--accent)}

.checks{list-style:none;margin:0;padding:0;display:flex;flex-direction:column}
.checks li{display:grid;grid-template-columns:22px minmax(0,1fr);gap:8px;padding:7px 0;border-bottom:1px dashed var(--line);font-size:14px}
.checks li:last-child{border-bottom:0}
.checks input{width:16px;height:16px;margin-top:3px;accent-color:var(--accent);cursor:pointer}
.checks li.on > div{color:var(--ink-3);text-decoration:line-through;text-decoration-color:var(--ink-3)}
.checks li > div{min-width:0}
.plain{margin:0;padding-left:18px;display:flex;flex-direction:column;gap:6px;font-size:14px}
.plain li{min-width:0}
.concepts{display:flex;flex-wrap:wrap;gap:6px;margin-top:8px}
.concepts span{font-size:12px;padding:2px 9px;border-radius:4px;background:var(--surface-2);color:var(--ink-2)}
.shad{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:8px}
.shad div{border:1px solid var(--line);border-radius:6px;padding:8px 10px;font-size:13px;background:var(--bg);min-width:0}
.shad code{font-weight:600;background:none;border:0;padding:0;color:var(--accent);font-size:12.5px}
.shad p{margin:2px 0 0;color:var(--ink-2)}
.files{font-family:var(--f-mono);font-size:12.5px;list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:3px}
.files li{overflow-wrap:anywhere;color:var(--ink-2)}
.files li::before{content:"└ ";color:var(--ink-3)}
.hints{display:flex;flex-direction:column;gap:10px}
.hint{border:1px solid var(--line);border-radius:6px;padding:10px 14px;background:var(--bg);font-size:14px}
.hint b{font-size:11px;text-transform:uppercase;letter-spacing:.08em;color:var(--ink-3);display:block;margin-bottom:4px}
.hint-more{align-self:flex-start}
.empty-note{color:var(--ink-3);font-size:13.5px;font-style:italic}
mark{background:var(--mark);color:inherit;border-radius:2px}

/* overview: architecture */
.roadmap{display:flex;flex-direction:column;gap:6px}
.rm-row{display:grid;grid-template-columns:96px minmax(0,1fr) 56px;gap:12px;align-items:center;font-size:13px;cursor:pointer;border-radius:6px;padding:4px 6px;background:none;border:0;text-align:left;width:100%}
.rm-row:hover{background:var(--surface-2)}
.rm-row b{font-family:var(--f-mono);font-size:12px}
.rm-track{position:relative;height:26px;background:var(--surface-2);border-radius:5px;overflow:hidden}
.rm-fill{position:absolute;inset:0 auto 0 0;background:var(--accent-soft);border-right:2px solid var(--accent)}
.rm-label{position:relative;padding:0 10px;line-height:26px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;font-size:12.5px;color:var(--ink)}
.rm-pts{font-family:var(--f-mono);font-size:12px;color:var(--ink-3);text-align:right}
.flow{display:flex;flex-wrap:wrap;gap:6px;align-items:stretch}
.flow .st{border:1px solid var(--line);background:var(--surface);border-radius:6px;padding:8px 10px;font-size:12.5px;min-width:0;flex:1 1 120px}
.flow .st b{display:block;font-size:12.5px}
.flow .st small{color:var(--ink-3);font-size:11.5px;display:block;line-height:1.4;margin-top:2px}
.flow .st.hl{border-color:var(--accent);background:var(--accent-soft)}
.flow .arr{align-self:center;color:var(--ink-3);font-size:14px}
.layers{display:flex;flex-direction:column;gap:6px}
.layer{display:grid;grid-template-columns:140px minmax(0,1fr);gap:14px;border:1px solid var(--line);background:var(--surface);border-radius:6px;padding:10px 14px;font-size:13.5px}
.layer b{font-family:var(--f-display)}
.layer p{margin:0;color:var(--ink-2)}
.layer .no{color:var(--bad);font-size:12.5px}
.modmap{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:10px}
.mod{border:1px solid var(--line);background:var(--surface);border-radius:var(--r);padding:12px 14px;font-size:13px;min-width:0}
.mod h4{font-family:var(--f-mono);font-size:13px;margin-bottom:4px}
.mod p{margin:0 0 6px;color:var(--ink-2)}
.mod .sp{font-size:11px;color:var(--ink-3)}

@media (max-width:900px){
  .app{grid-template-columns:minmax(0,1fr)}
  .rail{position:fixed;inset:0 auto 0 0;width:min(300px,86vw);z-index:20;transform:translateX(-102%);transition:transform .2s;padding-top:calc(20px + env(safe-area-inset-top,0px));height:100%}
  .rail.open{transform:none;box-shadow:0 0 0 100vmax rgba(0,0,0,.35)}
  .menu-btn{display:inline-flex}

<template id="tpl-be">
  <div class="section">
    <div class="eyebrow">Kiến trúc · apps/api</div>
    <h1 class="sp-title">NestJS: modular monolith, phân tầng nhẹ</h1>
    <p class="lead">Mục tiêu là code dễ đọc với một người và dễ tách khi lớn lên. Mỗi bounded context (identity, catalog, orders) là một Nest module tự chứa. Bên trong chỉ có 4 vai trò: controller, service, repository, mapper. Không dùng CQRS, event bus hay microservice ở v1, vì chúng giải quyết vấn đề ta chưa có.</p>
  </div>

  <div class="section">
    <h2>Vòng đời một request</h2>
    <p class="lead">Thứ tự này là thứ tự Nest chạy thật. Biết nó giúp bạn đặt logic đúng chỗ: xác thực ở guard, validate ở pipe, map lỗi ở filter.</p>
    <div class="flow">
      <div class="st"><b>Middleware</b><small>pino-http gắn reqId, cookie-parser</small></div><div class="arr">→</div>
      <div class="st"><b>Guards</b><small>Throttler → JwtAuthGuard (global, bỏ qua nếu @Public) → RolesGuard</small></div><div class="arr">→</div>
      <div class="st"><b>Pipes</b><small>ZodValidationPipe (nestjs-zod) parse body/query/params</small></div><div class="arr">→</div>
      <div class="st hl"><b>Controller</b><small>Nhận DTO đã sạch, gọi 1 service method</small></div><div class="arr">→</div>
      <div class="st"><b>Service</b><small>Business rule, ném DomainError</small></div><div class="arr">→</div>
      <div class="st"><b>Repository</b><small>Prisma, chỉ ở đây</small></div>
    </div>
    <div class="flow">
      <div class="st" style="flex:1 1 100%"><b>ProblemDetailsFilter (APP_FILTER)</b><small>Bắt mọi exception: DomainError → 404/409/422, ZodValidationException → 400 + errors[], HttpException → giữ status, lỗi lạ → 500 không lộ stack. Body luôn là <code>application/problem+json</code> kèm <code>instance</code> và <code>reqId</code>.</small></div>
    </div>
  </div>

  <div class="section">
    <h2>Bốn tầng và luật của từng tầng</h2>
    <div class="layers">
      <div class="layer"><b>Controller</b><div><p>Khai báo route, status code, cookie. Nhận DTO tạo từ schema contracts bằng <code>createZodDto()</code>. Gọi đúng một method của service và trả kết quả.</p><p class="no">Không: gọi Prisma, if/else nghiệp vụ, try/catch để đổi lỗi.</p></div></div>
      <div class="layer"><b>Service</b><div><p>Một method là một use case (<code>createProduct</code>, <code>rotateRefreshToken</code>). Chứa business rule và transaction. Ném <code>ConflictError</code>, <code>NotFoundError</code>… thay vì <code>HttpException</code>, nên service không biết gì về HTTP và test được bằng unit test thuần.</p><p class="no">Không: đọc <code>req</code>/<code>res</code>, trả object Prisma ra ngoài module.</p></div></div>
      <div class="layer"><b>Repository</b><div><p>Nơi duy nhất trong module chạm vào <code>PrismaService</code>. Gom các query (kể cả <code>include</code>/<code>select</code>) để service đọc như ngôn ngữ nghiệp vụ: <code>findBySlug</code>, <code>existsInCategory</code>.</p><p class="no">Không: business rule; không export ra module khác.</p></div></div>
      <div class="layer"><b>Mapper</b><div><p>Hàm thuần <code>toProductResponse(entity): Product</code>. Đây là "biên giới" giữa type Prisma và type contracts, nên <code>passwordHash</code> hay cột nội bộ không bao giờ lọt ra ngoài.</p></div></div>
    </div>
    <div class="tip"><strong>Khi nào cần thêm tầng?</strong> Nếu một service vượt khoảng 300 dòng hoặc một use case cần 3 repository trở lên, tách thành use-case class riêng (<code>PlaceOrderUseCase</code>). Đừng làm trước khi gặp vấn đề.</div>
  </div>

  <div class="section">
    <h2>Bản đồ module</h2>
    <div class="modmap">
      <div class="mod"><h4>config/</h4><p>Zod parse <code>process.env</code> lúc boot. Inject <code>AppConfig</code> có type thay vì gọi <code>process.env</code> rải rác.</p><span class="sp">Sprint 1</span></div>
      <div class="mod"><h4>infra/prisma</h4><p><code>@Global()</code> PrismaModule. <code>PrismaService extends PrismaClient</code>, kết nối trong <code>onModuleInit</code>.</p><span class="sp">Sprint 2</span></div>
      <div class="mod"><h4>common/</h4><p>errors, ProblemDetailsFilter, decorators <code>@Public</code> <code>@Roles</code> <code>@CurrentUser</code>, guards, pagination, slugify, uuidv7.</p><span class="sp">Sprint 2–3</span></div>

      <div class="mod"><h4>modules/catalog</h4><p>Hai submodule categories và products, mỗi cái có controller public và controller <code>/admin</code> riêng.</p><span class="sp">Sprint 4–5</span></div>

    </div>

FROM base AS pruner

FROM base AS builder
COPY --from=pruner /repo/out/json/ .
RUN --mount=type=cache,id=pnpm,target=/root/.local/share/pnpm/store \\
    pnpm install --frozen-lockfile
COPY --from=pruner /repo/out/full/ .

FROM node:\${NODE_VERSION}-alpine AS runner
ENV NODE_ENV=production
WORKDIR /app
COPY --from=builder --chown=node:node /prod/api ./
USER node
EXPOSE 3000

CMD ["node", "dist/main.js"]</pre>

<h4>Sơ đồ rotation bình thường</h4>
<pre>login        → RT1 (family F)                         DB: RT1 active
refresh(RT1) → revoke RT1, phát RT2 (family F)         DB: RT1 revoked→RT2, RT2 active
refresh(RT2) → revoke RT2, phát RT3 (family F)         DB: RT2 revoked→RT3, RT3 active</pre>
<h4>Kịch bản tấn công (AC2)</h4>
<pre>1. Nạn nhân login           → RT1
2. Kẻ tấn công đánh cắp RT1 (malware, log rò rỉ…)
3. Nạn nhân refresh(RT1)    → RT2   (RT1 revoked)
4. Kẻ tấn công refresh(RT1) → RT1 đã revoked ⇒ REUSE!
   ⇒ revoke toàn bộ family F (gồm RT2 đang "hợp lệ") ⇒ 401
5. Nạn nhân refresh(RT2)    → 401 → phải login lại (mất phiên nhưng kẻ tấn công cũng mất)

Ngược lại: nếu kẻ tấn công refresh trước (bước 3↔4 đảo), kẻ tấn công nhận RT2,

findByHash(hash: string, tx?: Prisma.TransactionClient): Promise&lt;RefreshToken | null&gt;
revokeIfActive(id: string, replacedById: string | null, tx?): Promise&lt;boolean&gt;  // true nếu chính lệnh này revoke
revokeFamily(familyId: string, tx?): Promise&lt;number&gt;
create(data: {...}, tx?): Promise&lt;RefreshToken&gt;

// auth.service.ts
refresh(raw: string): Promise&lt;{ user: UserResponse; tokens: AuthTokens }&gt;
logout(raw: string | undefined): Promise&lt;void&gt;</pre>
<h4>refresh — pseudo-step (bạn tự hiện thực)</h4>

<h4>Race condition — vì sao cần conditional update</h4>
<pre>Request A ─ findByHash(RT1): active ─┐
Request B ─ findByHash(RT1): active ─┤  cả hai "thấy" RT1 hợp lệ
A: update RT1 set revokedAt=now  ✓   │
B: update RT1 set revokedAt=now  ✓   ┘  ⇒ 2 token mới cùng family! (nếu update không điều kiện)

Giải pháp: updateMany({ where: { id, revokedAt: null }, data: {...} }) → count
A: count = 1 ✓   B: count = 0 ⇒ B bị xem là reuse</pre>

<li>Access JWT hiện tại vẫn "sống" tới khi hết hạn (≤ 15 phút) vì stateless — chấp nhận ở v1, vì cookie đã bị xóa phía trình duyệt.</li>

async listAdmin(p: { storeId: string; categoryId?: string; skip: number; take: number }) {
  const where = { storeId: p.storeId, ...(p.categoryId &amp;&amp; { categoryId: p.categoryId }) }
  return this.prisma.$transaction([
    this.prisma.product.findMany({ where, skip: p.skip, take: p.take, orderBy: [{ createdAt: 'desc' }, { id: 'desc' }], include: { category: { select: { id: true, name: true } } } }),
    this.prisma.product.count({ where }),
  ])
}</pre>

export interface AuthorizePaymentInput { amountMinor: number; currency: string; reference: string }
export interface PaymentAuthorization { status: 'authorized' | 'declined'; ref: string }
export interface PaymentProvider { authorize(input: AuthorizePaymentInput): Promise&lt;PaymentAuthorization&gt; }
export const PAYMENT_PROVIDER = Symbol('PAYMENT_PROVIDER');

// infra/payment/payment.module.ts

<h4>Pure pricing — chữ ký</h4>
<pre>type Line = { productId: string; quantity: number };
type PricedProduct = { id: string; name: string; priceMinor: number; currency: string };
type PricedItem = { productId: string; productName: string; unitPriceMinor: number; quantity: number; lineTotalMinor: number };

export function priceOrder(lines: Line[], products: PricedProduct[]):
  { items: PricedItem[]; totalMinor: number; currency: string }</pre>
<h4>OrdersService.placeOrder — pseudo-step (tự viết code)</h4>
<pre>placeOrder(userId, idempotencyKey, input):
  1. existing = repo.findByIdempotencyKey(userId, key)
     nếu có → return { order: existing, replayed: true }
  2. ids = unique(input.items.map(productId))
     products = productsService.findByIds(ids)
     missing = ids − products.ids → nếu ≠ ∅ → throw UnprocessableError(missing)
  3. priced = priceOrder(input.items, products)       // giá từ DB, KHÔNG từ body
  4. auth = payment.authorize({ amountMinor: priced.totalMinor, … })
     declined → throw UnprocessableError('payment-declined')
  5. try:
       order = prisma.$transaction(tx =&gt; repo.createWithItems(tx, {...}))
     catch P2002 trên idempotency key:
       order = repo.findByIdempotencyKey(userId, key); return replayed
  6. return { order, replayed: false }</pre>
<div class="warn"><strong>Vì sao bước 1 chưa đủ chống trùng?</strong> Hai request đến cùng lúc đều chạy bước 1, đều thấy "chưa có", đều tạo. Chỉ <strong>unique constraint</strong> trong DB mới là chốt chặn thật — bước 1 chỉ là fast path. Đây là pattern "check-then-act" kinh điển.</div>
<div class="note"><strong>Body khác nhưng cùng key?</strong> Chuẩn Stripe trả 422/409 nếu payload khác. v1 có thể bỏ qua (trả đơn cũ), nhưng ghi vào PR như một quyết định có ý thức. Bonus: lưu <code>requestHash</code> để so.</div>
<div class="tip"><strong>Payment trước hay sau transaction?</strong> Gọi dịch vụ ngoài <em>bên trong</em> transaction giữ khóa DB lâu và không rollback được phía provider. v1 gọi trước rồi lưu <code>paymentRef</code>. Thảo luận trong ADR ngắn (ADR-0008 Payment port) nếu bạn muốn.</div>

</script>
<script>
(function(){
  "use strict";
  var DATA = (window.PXM && window.PXM.sprints || []).slice().sort(function(a,b){return a.n-b.n;});
  var AREAS = {api:"API",web:"Web",admin:"Admin",contracts:"Contracts",devops:"DevOps",db:"DB",security:"Security",docs:"Docs"};
  var GUIDES = [
    {id:"overview", label:"Tổng quan", tpl:"tpl-overview", sub:"Lộ trình & epics"},
    {id:"be", label:"Backend NestJS", tpl:"tpl-be", sub:"Module, tầng, quy ước"},
    {id:"fe", label:"Frontend & shadcn", tpl:"tpl-fe", sub:"Web, admin, component"},
    {id:"contracts", label:"Contracts & test", tpl:"tpl-contracts", sub:"Zod, api-client, test"}
  ];
  var KEY = "pxm-playbook-v1";
  var store = {checks:{}, hints:{}, filters:[], open:{}};
  try { var raw = localStorage.getItem(KEY); if (raw) { var p = JSON.parse(raw); store.checks=p.checks||{}; store.hints=p.hints||{}; store.filters=p.filters||[]; } } catch(e){}
  function save(){ try { localStorage.setItem(KEY, JSON.stringify({checks:store.checks,hints:store.hints,filters:store.filters})); } catch(e){} }

  var view = document.getElementById("view");
  var q = document.getElementById("q");
  var current = "overview";

  function esc(s){ return String(s==null?"":s).replace(/[&<>"]/g,function(c){return {"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c];}); }
  function fold(s){ return String(s||"").normalize("NFD").replace(/[̀-ͯ]/g,"").replace(/đ/g,"d").replace(/Đ/g,"D").toLowerCase(); }
  function el(html){ var d=document.createElement("div"); d.innerHTML=html; return d; }
  function arr(x){ return Array.isArray(x)?x:[]; }

  function ticketTotals(t){
    var s = arr(t.steps).length, a = arr(t.ac).length, done=0;
    arr(t.steps).forEach(function(_,i){ if(store.checks[t.key+":s:"+i]) done++; });
    arr(t.ac).forEach(function(_,i){ if(store.checks[t.key+":a:"+i]) done++; });
    return {total:s+a, done:done};
  }
  function sprintTotals(sp){
    var tot=0, done=0, pts=0, ptsDone=0;
    arr(sp.tickets).forEach(function(t){ var x=ticketTotals(t); tot+=x.total; done+=x.done; pts+=t.pts||0; if(x.total && x.done===x.total) ptsDone+=t.pts||0; });
    return {total:tot, done:done, pct: tot? Math.round(done*100/tot):0, pts:pts, ptsDone:ptsDone};
  }

  /* ---------- nav ---------- */
  function buildNav(){
    var g = document.getElementById("nav-guide");
    GUIDES.forEach(function(x){
      var b = document.createElement("button"); b.type="button"; b.className="nav-btn"; b.dataset.go=x.id;
      b.innerHTML = '<span class="nav-num">'+({overview:"◆",be:"B",fe:"F",contracts:"C"}[x.id])+'</span><span>'+esc(x.label)+'<span class="nav-sub">'+esc(x.sub)+'</span></span><span></span>';
      g.appendChild(b);
    });
    var s = document.getElementById("nav-sprints");
    DATA.forEach(function(sp){
      var b = document.createElement("button"); b.type="button"; b.className="nav-btn"; b.dataset.go="s"+sp.n;
      b.innerHTML = '<span class="nav-num">'+sp.n+'</span><span>'+esc(sp.name)+'<span class="nav-sub">'+esc(sp.version)+' · '+esc(sp.dates)+'</span><span class="mini-bar"><span data-mini="'+sp.n+'"></span></span></span><span class="nav-meta">'+(sp.points||0)+'đ</span>';
      s.appendChild(b);
    });
    if(!DATA.length){ s.appendChild(el('<div class="empty-note" style="padding:0 8px">Chưa có dữ liệu sprint.</div>')); }
    document.getElementById("rail").addEventListener("click",function(e){
      var b=e.target.closest("[data-go]"); if(!b) return;
      go(b.dataset.go); document.getElementById("rail").classList.remove("open");
    });
    refreshMini();
  }
  function refreshMini(){
    DATA.forEach(function(sp){ var m=document.querySelector('[data-mini="'+sp.n+'"]'); if(m) m.style.width=sprintTotals(sp).pct+"%"; });
  }
  function markNav(){
    document.querySelectorAll(".nav-btn").forEach(function(b){ b.setAttribute("aria-current", b.dataset.go===current?"true":"false"); });
  }

  /* ---------- routing ---------- */
  function go(id, focusKey){
    q.value=""; current=id; render(focusKey);
    try { history.replaceState(null,"","#"+id); } catch(e){}
    window.scrollTo(0,0);
  }
  function render(focusKey){
    markNav();
    view.innerHTML="";
    var guide = GUIDES.filter(function(x){return x.id===current;})[0];
    if(guide){
      view.appendChild(document.getElementById(guide.tpl).content.cloneNode(true));
      if(current==="overview") renderRoadmap();
      return;
    }
    var sp = DATA.filter(function(x){return "s"+x.n===current;})[0];
    if(sp){ renderSprint(sp, focusKey); return; }
    current="overview"; render();
  }

  function renderRoadmap(){
    var box=document.getElementById("roadmap"); if(!box) return;
    var max = Math.max.apply(null, DATA.map(function(s){return s.points||0;}).concat([1]));
    DATA.forEach(function(sp){
      var t=sprintTotals(sp);
      var b=document.createElement("button"); b.type="button"; b.className="rm-row";
      b.innerHTML='<b>S'+sp.n+' · '+esc(sp.version)+'</b><span class="rm-track"><span class="rm-fill" style="width:'+Math.max(t.pct,0)+'%"></span><span class="rm-label">'+esc(sp.name)+' · '+esc(sp.dates)+'</span></span><span class="rm-pts">'+t.pct+'%</span>';
      b.title = sp.goal||"";
      b.addEventListener("click",function(){go("s"+sp.n);});
      box.appendChild(b);
    });
    box.appendChild(el('<div class="empty-note" style="font-style:normal;font-size:12px;padding:6px 6px 0">Thanh xanh là tỉ lệ bước + AC bạn đã tick trong sprint.</div>').firstChild);
  }

  /* ---------- sprint ---------- */
  function renderSprint(sp, focusKey){
    var t = sprintTotals(sp);
    var h = '';
    h += '<header class="sp-head"><div><div class="eyebrow">Sprint '+sp.n+' · '+esc(sp.version)+' · '+esc(sp.dates)+'</div>';
    h += '<h1 class="sp-title">'+esc(sp.name)+'</h1><p class="sp-goal">'+esc(sp.goal)+'</p></div>';
    h += '<div class="sp-stats"><div class="stat"><b>'+(sp.points||t.pts)+'</b><span>Điểm</span></div><div class="stat"><b>'+arr(sp.tickets).length+'</b><span>Ticket</span></div><div class="stat"><b id="sp-ptsdone">'+t.ptsDone+'</b><span>Điểm xong</span></div></div>';
    h += '<div class="progress"><span id="sp-pct">'+t.done+'/'+t.total+' mục</span><div class="bar"><span id="sp-bar" style="width:'+t.pct+'%"></span></div><span id="sp-pct2">'+t.pct+'%</span></div></header>';
    if(arr(sp.learn).length){ h+='<div class="section"><h2>Học được</h2><div class="tags">'+sp.learn.map(function(x){return '<span class="tag">'+esc(x)+'</span>';}).join("")+'</div></div>'; }
    h += '<div class="grid2">';
    h += '<div class="panel"><h3>Thứ tự làm đề xuất</h3><ol class="order-list">'+arr(sp.order).map(function(o){return '<li><div><a data-jump="'+esc(o.key)+'">'+esc(o.key)+'</a> '+esc(titleOf(sp,o.key))+'<div style="color:var(--ink-3);font-size:12.5px">'+o.why+'</div></div></li>';}).join("")+'</ol></div>';
    h += '<div class="panel"><h3>Rủi ro</h3>'+(arr(sp.risks).map(function(r){return '<div class="risk"><span class="lvl '+esc(r.level)+'">'+({high:"Cao",med:"Vừa",low:"Thấp"}[r.level]||esc(r.level))+'</span><div>'+r.text+'</div></div>';}).join("")||'<div class="empty-note">Không có rủi ro đáng kể.</div>')+'</div>';
    h += '</div>';
    var ov = sp.overview||{}; var ovTabs = [["be","Backend"],["fe","Frontend"],["infra","Hạ tầng"]].filter(function(x){return ov[x[0]];});
    if(ovTabs.length){
      h += '<div class="section"><h2>Thiết kế cấp sprint</h2><div class="panel" style="padding-top:4px"><div class="tabs" role="tablist" data-tabs="ov">'+ovTabs.map(function(x,i){return '<button type="button" class="tab" role="tab" aria-selected="'+(i===0)+'" data-tab="'+x[0]+'">'+x[1]+'</button>';}).join("")+'</div>';
      ovTabs.forEach(function(x,i){ h+='<div class="tabpanel prose" data-panel="'+x[0]+'"'+(i?' hidden':'')+'>'+ov[x[0]]+'</div>'; });
      h += '</div></div>';
    }
    if(arr(sp.timeline).length){ h+='<div class="section"><h2>Phân bổ thời gian <small>~6–8 giờ/tuần</small></h2><div class="panel timeline">'+sp.timeline.map(function(r){return '<div class="tl-row"><b>'+esc(r.day)+'</b><div>'+r.text+'</div></div>';}).join("")+'</div></div>'; }
    // tickets
    var areas = {}; arr(sp.tickets).forEach(function(t){ arr(t.area).forEach(function(a){areas[a]=1;}); });
    h += '<div class="section"><h2>Tickets</h2><div class="filters" id="filters">';
    Object.keys(areas).forEach(function(a){ h+='<button type="button" class="chip" style="--c:var(--a-'+a+')" data-area="'+a+'" aria-pressed="'+(store.filters.indexOf(a)>=0)+'"><i></i>'+esc(AREAS[a]||a)+'</button>'; });
    h += '<span class="spacer"></span><button type="button" class="tool-btn" id="exp-all">Mở tất cả</button><button type="button" class="tool-btn" id="col-all">Thu gọn</button></div>';
    h += '<div class="tickets" id="tickets"></div></div>';
    if(arr(sp.demo).length){ h+='<div class="section"><h2>Demo cuối sprint</h2><div class="panel"><ol class="plain">'+sp.demo.map(function(d){return '<li>'+d+'</li>';}).join("")+'</ol></div></div>'; }
    view.innerHTML = h;
    var list = document.getElementById("tickets");
    arr(sp.tickets).forEach(function(t){ list.appendChild(ticketEl(t, sp)); });
    applyFilters();
    wireTabs(view);
    view.querySelector("#filters").addEventListener("click",function(e){
      var c=e.target.closest(".chip"); if(!c) return;
      var a=c.dataset.area, i=store.filters.indexOf(a);
      if(i>=0) store.filters.splice(i,1); else store.filters.push(a);
      c.setAttribute("aria-pressed", i<0); save(); applyFilters();
    });
    document.getElementById("exp-all").onclick=function(){ list.querySelectorAll("details.ticket").forEach(function(d){ if(!d.hidden) d.open=true; }); };
    document.getElementById("col-all").onclick=function(){ list.querySelectorAll("details.ticket").forEach(function(d){ d.open=false; }); };
    view.querySelectorAll("[data-jump]").forEach(function(a){ a.addEventListener("click",function(){ openTicket(a.dataset.jump); }); });
    if(focusKey) openTicket(focusKey);
  }
  function titleOf(sp,key){ var t=arr(sp.tickets).filter(function(x){return x.key===key;})[0]; return t?t.title:""; }
  function applyFilters(){
    var f=store.filters; var shown=0;
    document.querySelectorAll("#tickets details.ticket").forEach(function(d){
      var ar=(d.dataset.areas||"").split(",");
      var vis = !f.length || f.some(function(a){return ar.indexOf(a)>=0;});
      d.hidden=!vis; if(vis) shown++;
    });
    var e=document.getElementById("no-match"); if(e) e.remove();
    if(!shown){ var l=document.getElementById("tickets"); if(l) l.appendChild(el('<div id="no-match" class="empty-note">Không có ticket nào thuộc nhóm đang lọc. Bỏ chọn bộ lọc để xem lại toàn bộ.</div>').firstChild); }
  }
  function openTicket(key){
    var d=document.getElementById("t-"+key); if(!d) return;
    if(d.hidden){ store.filters=[]; save(); document.querySelectorAll("#filters .chip").forEach(function(c){c.setAttribute("aria-pressed","false");}); applyFilters(); }
    d.open=true; d.scrollIntoView({behavior:"smooth",block:"start"});
  }

  function ticketEl(t, sp){
    var d=document.createElement("details"); d.className="ticket"; d.id="t-"+t.key; d.dataset.areas=arr(t.area).join(",");
    var tt=ticketTotals(t);
    var s='<summary><span class="t-key">'+esc(t.key)+'</span><span class="t-title">'+esc(t.title)+'</span>';
    s+='<span class="t-meta"><span class="t-prog'+(tt.total&&tt.done===tt.total?' done':'')+'" data-prog="'+esc(t.key)+'">'+tt.done+'/'+tt.total+'</span><span class="pts">'+(t.pts||0)+' pt</span><svg class="caret" width="14" height="14" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.8"><path d="m6 3 5 5-5 5"/></svg></span>';
    s+='<span class="t-sub"><span class="type'+(t.type==="Story"?' story':'')+'">'+esc(t.type)+'</span>'+arr(t.area).map(function(a){return '<span class="area" style="--c:var(--a-'+a+')">'+esc(AREAS[a]||a)+'</span>';}).join("")+'<span class="owner '+(t.selfWrite?'self':'ai')+'" title="'+(t.selfWrite?'Phần bài học: bạn tự viết, Claude chỉ gợi ý':'Có thể giao Claude viết, bạn review kỹ')+'">'+(t.selfWrite?'Tự viết':'Có thể giao Claude')+'</span><span>'+esc(t.code||"")+' · '+esc(t.epic||"")+'</span></span></summary>';
    d.innerHTML=s+'<div class="t-body"></div>';
    var built=false;
    d.addEventListener("toggle",function(){ if(d.open && !built){ built=true; buildBody(d.querySelector(".t-body"), t); } });
    return d;
  }

  function buildBody(body, t){
    var h='';
    if(t.why) h+='<p class="t-why">'+t.why+'</p>';
    h+='<div class="kv">';
    if(t.branch) h+='<div><span>Branch</span><code>'+esc(t.branch)+'</code><button type="button" class="copy" data-copy="'+esc(t.branch)+'">copy</button></div>';
    if(t.pr) h+='<div><span>Tiêu đề PR</span><code>'+esc(t.pr)+'</code><button type="button" class="copy" data-copy="'+esc(t.pr)+'">copy</button></div>';
    h+='</div>';
    if(arr(t.concepts).length) h+='<div class="concepts">'+t.concepts.map(function(c){return '<span>'+c+'</span>';}).join("")+'</div>';
    var tabs=[];
    tabs.push(["steps","Các bước",arr(t.steps).length]);
    if(t.be) tabs.push(["be","Backend"]);
    if(t.fe) tabs.push(["fe","Frontend"]);
    if(t.infra) tabs.push(["infra","Hạ tầng"]);
    if(arr(t.shadcn).length) tabs.push(["shadcn","shadcn",t.shadcn.length]);
    if(arr(t.files).length) tabs.push(["files","File",t.files.length]);
    if(arr(t.tests).length) tabs.push(["tests","Test",t.tests.length]);
    if(arr(t.pitfalls).length) tabs.push(["pitfalls","Lỗi hay gặp",t.pitfalls.length]);
    if(arr(t.hints).length) tabs.push(["hints","Gợi ý"]);
    tabs.push(["ac","AC & kiểm chứng",arr(t.ac).length]);
    h+='<div class="tabs" role="tablist" style="margin-top:14px">'+tabs.map(function(x,i){return '<button type="button" class="tab" role="tab" aria-selected="'+(i===0)+'" data-tab="'+x[0]+'">'+x[1]+(x[2]!=null?'<span class="cnt">'+x[2]+'</span>':'')+'</button>';}).join("")+'</div>';
    tabs.forEach(function(x,i){ h+='<div class="tabpanel'+(["be","fe","infra"].indexOf(x[0])>=0?' prose':'')+'" data-panel="'+x[0]+'"'+(i?' hidden':'')+'>'+panel(x[0],t)+'</div>'; });
    body.innerHTML=h;
    wireTabs(body);
    body.addEventListener("change",function(e){
      var c=e.target; if(!c.matches("input[data-ck]")) return;
      if(c.checked) store.checks[c.dataset.ck]=1; else delete store.checks[c.dataset.ck];
      c.closest("li").classList.toggle("on",c.checked); save(); updateProgress(t);
    });
    body.addEventListener("click",function(e){
      var cp=e.target.closest("[data-copy]");
      if(cp){ var txt=cp.dataset.copy; var done=function(){cp.textContent="đã copy"; setTimeout(function(){cp.textContent="copy";},1400);};
        try{ navigator.clipboard.writeText(txt).then(done,function(){selectText(cp.previousElementSibling);}); }catch(err){ selectText(cp.previousElementSibling); } }
      var hm=e.target.closest("[data-hint-more]");
      if(hm){ store.hints[t.key]=(store.hints[t.key]||1)+1; save(); var p=body.querySelector('[data-panel="hints"]'); p.innerHTML=panel("hints",t); }
      var hl=e.target.closest("[data-hint-less]");
      if(hl){ store.hints[t.key]=1; save(); var p2=body.querySelector('[data-panel="hints"]'); p2.innerHTML=panel("hints",t); }
    });
  }
  function selectText(n){ if(!n) return; var r=document.createRange(); r.selectNodeContents(n); var s=getSelection(); s.removeAllRanges(); s.addRange(r); }
  function checklist(items, t, kind){
    return '<ul class="checks">'+items.map(function(x,i){ var k=t.key+":"+kind+":"+i; var on=!!store.checks[k];
      return '<li class="'+(on?'on':'')+'"><input type="checkbox" id="ck-'+esc(k.replace(/:/g,"-"))+'" data-ck="'+esc(k)+'"'+(on?' checked':'')+' aria-label="Đánh dấu xong"><div>'+x+'</div></li>'; }).join("")+'</ul>';
  }
  function panel(k,t){
    switch(k){
      case "steps": return arr(t.steps).length? checklist(t.steps,t,"s") : '<div class="empty-note">Chưa có bước.</div>';
      case "be": return t.be; case "fe": return t.fe; case "infra": return t.infra;
      case "shadcn": return '<div class="shad">'+t.shadcn.map(function(x){ return '<div><code>'+esc(x.c)+'</code><p>'+(x.use||"")+'</p></div>'; }).join("")+'</div>'+
        '<div class="note">Cài: <code>pnpm dlx shadcn@latest add '+esc(t.shadcn.map(function(x){return x.c;}).filter(function(c){return /^[a-z-]+$/.test(c);}).join(" "))+'</code></div>';
      case "files": return '<ul class="files">'+t.files.map(function(f){return '<li>'+f+'</li>';}).join("")+'</ul>';
      case "tests": return '<div class="note" style="margin-top:0">Tự liệt kê case của bạn trước, rồi mới mở danh sách này để so sánh.</div><ul class="plain">'+t.tests.map(function(x){return '<li>'+x+'</li>';}).join("")+'</ul>';
      case "pitfalls": return '<ul class="plain">'+t.pitfalls.map(function(x){return '<li>'+x+'</li>';}).join("")+'</ul>';
      case "hints":
        var hs=arr(t.hints).slice().sort(function(a,b){return (a.level||0)-(b.level||0);});
        var lv=Math.min(store.hints[t.key]||1, hs.length);
        var names={1:"Mức 1 · Gợi ý",2:"Mức 2 · Khái niệm",3:"Mức 3 · Chỉ chỗ / pseudo-code"};
        var out='<div class="hints">'+hs.slice(0,lv).map(function(x){return '<div class="hint"><b>'+(names[x.level]||("Mức "+x.level))+'</b>'+x.text+'</div>';}).join("");
        if(lv<hs.length) out+='<button type="button" class="tool-btn hint-more" data-hint-more>Mở mức '+(lv+1)+'</button>';
        else if(hs.length>1) out+='<button type="button" class="tool-btn hint-more" data-hint-less>Ẩn bớt, quay về mức 1</button>';
        return out+'</div>';
      case "ac":
        var o='';
        o+= arr(t.ac).length? '<h4 style="font-size:13px;margin:0 0 4px">Acceptance Criteria</h4>'+checklist(t.ac,t,"a") : '';
        if(arr(t.verify).length) o+='<h4 style="font-size:13px;margin:16px 0 4px">Cách kiểm chứng</h4><ul class="plain">'+t.verify.map(function(x){return '<li>'+x+'</li>';}).join("")+'</ul>';
        return o||'<div class="empty-note">Chưa có AC.</div>';
    }
    return "";
  }
  function updateProgress(t){
    var x=ticketTotals(t); var p=document.querySelector('[data-prog="'+t.key+'"]');
    if(p){ p.textContent=x.done+"/"+x.total; p.classList.toggle("done", x.total>0 && x.done===x.total); }
    var sp=DATA.filter(function(s){return "s"+s.n===current;})[0];
    if(sp){ var st=sprintTotals(sp);
      var a=document.getElementById("sp-bar"); if(a) a.style.width=st.pct+"%";
      var b=document.getElementById("sp-pct"); if(b) b.textContent=st.done+"/"+st.total+" mục";
      var c=document.getElementById("sp-pct2"); if(c) c.textContent=st.pct+"%";
      var d=document.getElementById("sp-ptsdone"); if(d) d.textContent=st.ptsDone; }
    refreshMini();
  }
  function wireTabs(root){
    root.querySelectorAll(".tabs").forEach(function(bar){
      if(bar._wired) return; bar._wired=true;
      bar.addEventListener("click",function(e){
        var b=e.target.closest(".tab"); if(!b) return;
        bar.querySelectorAll(".tab").forEach(function(x){x.setAttribute("aria-selected", x===b);});
        var host=bar.parentElement;
        Array.prototype.forEach.call(host.children,function(c){ if(c.classList && c.classList.contains("tabpanel")) c.hidden = c.dataset.panel!==b.dataset.tab; });
      });
    });
  }

  /* ---------- search ---------- */
  var index=[];
  DATA.forEach(function(sp){ arr(sp.tickets).forEach(function(t){
    var txt=[t.key,t.code,t.title,t.why,t.branch,arr(t.area).join(" "),arr(t.concepts).join(" "),arr(t.steps).join(" "),t.be,t.fe,t.infra,arr(t.shadcn).map(function(x){return x.c+" "+x.use;}).join(" "),arr(t.files).join(" "),arr(t.tests).join(" "),arr(t.pitfalls).join(" "),arr(t.ac).join(" ")].join(" ");
    var plain = txt.replace(/<[^>]+>/g," ").replace(/&lt;/g,"<").replace(/&gt;/g,">").replace(/&amp;/g,"&");
    index.push({sp:sp,t:t,text:fold(plain),raw:plain});
  }); });
  function snippet(raw, words){
    var f=fold(raw), pos=-1; words.forEach(function(w){ var p=f.indexOf(w); if(p>=0 && (pos<0||p<pos)) pos=p; });
    if(pos<0) return "";
    var a=Math.max(0,pos-60), b=Math.min(raw.length,pos+120);
    var piece=raw.slice(a,b).replace(/\s+/g," ");
    var safe=esc(piece), fpiece=fold(piece);
    // highlight by folded positions on the raw piece (same length after NFD-strip in most cases)
    var marks=[]; words.forEach(function(w){ var i=0; while((i=fpiece.indexOf(w,i))>=0){ marks.push([i,i+w.length]); i+=w.length; } });
    if(fpiece.length===piece.length && marks.length){ marks.sort(function(x,y){return x[0]-y[0];}); var out="",last=0; marks.forEach(function(m){ if(m[0]<last) return; out+=esc(piece.slice(last,m[0]))+"<mark>"+esc(piece.slice(m[0],m[1]))+"</mark>"; last=m[1]; }); out+=esc(piece.slice(last)); safe=out; }
    return (a>0?"… ":"")+safe+(b<raw.length?" …":"");
  }
  function runSearch(){
    var v=q.value.trim();
    if(!v){ render(); return; }
    var words=fold(v).split(/\s+/).filter(Boolean);
    var hits=index.filter(function(x){ return words.every(function(w){return x.text.indexOf(w)>=0;}); });
    document.querySelectorAll(".nav-btn").forEach(function(b){ b.setAttribute("aria-current","false"); });
    var h='<div class="section"><div class="eyebrow">Tìm kiếm</div><h1 class="sp-title">'+hits.length+' ticket khớp “'+esc(v)+'”</h1></div>';
    if(!hits.length) h+='<p class="empty-note">Không thấy ticket nào. Thử từ khóa ngắn hơn, ví dụ “cookie”, “slug”, “sidebar”.</p>';
    h+='<div class="tickets">';
    hits.forEach(function(x){
      h+='<button type="button" class="ticket" style="text-align:left;cursor:pointer;padding:12px 16px;display:flex;flex-direction:column;gap:4px;width:100%" data-open="s'+x.sp.n+'|'+esc(x.t.key)+'"><span><span class="t-key">'+esc(x.t.key)+'</span> <span class="t-title">'+esc(x.t.title)+'</span> <span class="pts">S'+x.sp.n+'</span></span><span style="font-size:13px;color:var(--ink-2)">'+snippet(x.raw,words)+'</span></button>';
    });
    view.innerHTML=h+'</div>';
    view.querySelectorAll("[data-open]").forEach(function(b){ b.addEventListener("click",function(){ var p=b.dataset.open.split("|"); go(p[0],p[1]); }); });
  }
  var timer; q.addEventListener("input",function(){ clearTimeout(timer); timer=setTimeout(runSearch,120); });
  document.addEventListener("keydown",function(e){
    if(e.key==="/" && document.activeElement!==q && !/input|textarea/i.test(document.activeElement.tagName)){ e.preventDefault(); q.focus(); }
    if(e.key==="Escape" && document.activeElement===q){ q.value=""; render(); }
  });

  /* ---------- chrome ---------- */
  document.getElementById("menu-btn").onclick=function(){ document.getElementById("rail").classList.toggle("open"); };
  document.addEventListener("click",function(e){ var r=document.getElementById("rail"); if(r.classList.contains("open") && !r.contains(e.target) && !e.target.closest("#menu-btn")) r.classList.remove("open"); });
  var themeBtns=document.querySelectorAll("[data-theme-set]");
  function setTheme(m){ if(m==="system") document.documentElement.removeAttribute("data-theme"); else document.documentElement.setAttribute("data-theme",m);
    themeBtns.forEach(function(b){b.setAttribute("aria-pressed", b.dataset.themeSet===m);}); try{localStorage.setItem(KEY+"-theme",m);}catch(e){} }
  var savedTheme="system"; try{ savedTheme=localStorage.getItem(KEY+"-theme")||"system"; }catch(e){}
  setTheme(savedTheme);
  themeBtns.forEach(function(b){ b.onclick=function(){ setTheme(b.dataset.themeSet); }; });
  document.getElementById("reset-progress").onclick=function(){ document.getElementById("reset-confirm").hidden=false; };
  document.getElementById("reset-no").onclick=function(){ document.getElementById("reset-confirm").hidden=true; };
  document.getElementById("reset-yes").onclick=function(){ store.checks={}; store.hints={}; save(); document.getElementById("reset-confirm").hidden=true; refreshMini(); render(); };

  buildNav();
  var h0=(location.hash||"").replace("#","");
  if(h0 && (GUIDES.some(function(g){return g.id===h0;}) || DATA.some(function(s){return "s"+s.n===h0;}))) current=h0;
  render();
})();
</script>
</body></html>
